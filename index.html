<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>API 小记录</title>
<style>
:root{
  --bg:#fff9f4;
  --paper:#fffdf9;
  --pink:#f7a9bd;
  --pink-deep:#ef7fa0;
  --pink-soft:#fde8ef;
  --blue:#dff1ff;
  --blue-deep:#8ec8ef;
  --yellow:#fff0bd;
  --cream:#fff6df;
  --mint:#dff5e9;
  --text:#2e3443;
  --muted:#7f8796;
  --line:#eadfd8;
  --shadow:0 14px 40px rgba(110,85,95,.10);
  --radius:20px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background:
    radial-gradient(circle at 10% 0%, #ffe5ed 0 16%, transparent 36%),
    radial-gradient(circle at 100% 12%, #eaf5ff 0 14%, transparent 34%),
    linear-gradient(135deg,#fffaf5,#fffdf9);
  color:var(--text);
  min-height:100vh;
}
button,input,textarea,select{font:inherit}
body.modal-open{
  overflow:hidden;
  overscroll-behavior:none;
}
.app{
  width:min(1180px, calc(100% - 28px));
  margin:26px auto;
  background:rgba(255,253,249,.94);
  border:1px solid rgba(234,223,216,.9);
  border-radius:28px;
  box-shadow:var(--shadow);
  overflow:visible;
}
.toolbar{
  display:flex;
  gap:12px;
  align-items:center;
  padding:18px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.75);
  backdrop-filter: blur(10px);
  border-radius:28px 28px 0 0;
}
.brand{
  font-weight:800;
  font-size:22px;
  letter-spacing:.02em;
  white-space:nowrap;
}
.brand::before{
  content:"♡";
  display:inline-grid;
  place-items:center;
  width:34px;height:34px;
  margin-right:8px;
  border-radius:50%;
  background:var(--pink-soft);
  color:var(--pink-deep);
}
.toolbar-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
  margin-left:auto;
}
.backup-btn{
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 13px;
  background:#fff;
  color:#596171;
  font-weight:800;
  cursor:pointer;
}
.backup-btn:hover{border-color:var(--pink);background:var(--pink-soft)}
.add-btn{
  border:0;
  border-radius:14px;
  padding:11px 17px;
  background:linear-gradient(135deg,var(--pink),var(--pink-deep));
  color:white;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 18px rgba(239,127,160,.22);
}
.table-wrap{overflow:auto}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  min-width:1040px;
}
th,td{
  padding:13px 14px;
  border-bottom:1px solid var(--line);
  border-right:1px solid #f1e8e2;
  text-align:left;
  vertical-align:top;
  background:#fffdfb;
}
th{
  position:sticky;
  top:0;
  z-index:2;
  font-size:13px;
  font-weight:800;
}
th:nth-child(1){background:var(--pink-soft)}
th:nth-child(2){background:var(--blue)}
th:nth-child(3){background:var(--yellow)}
th:nth-child(4){background:#ffeaf1}
th:nth-child(5){background:#fff2c9}
th:nth-child(6){background:#e8f3ff}
th:nth-child(7){background:var(--cream)}
td:last-child,th:last-child{border-right:none}
.url a{color:#4aa2dd;text-decoration:none;word-break:break-all}
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:46px;
  padding:5px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}
.badge.yes{background:var(--mint);color:#329866}
.badge.no{background:#ffe0e7;color:#d85b7b}
.models{
  display:flex;flex-wrap:wrap;gap:6px;
}
.tag{
  display:inline-block;
  padding:5px 8px;
  border-radius:9px;
  background:#f7f8fb;
  font-size:12px;
  line-height:1.3;
}
.actions{white-space:nowrap}
.icon-btn{
  width:34px;height:34px;
  border:0;border-radius:11px;
  cursor:pointer;
  display:grid;
  place-items:center;
  padding:0;
  line-height:1;
}
.edit{background:#e7f4ff;color:#2a92d5}
.del{background:#ffe7ed;color:#e65f81}
.empty{
  text-align:center;
  color:var(--muted);
  padding:38px 20px;
}
.record-head{
  display:grid;
  grid-template-columns:minmax(180px,1.05fr) minmax(90px,.48fr) minmax(300px,1.75fr) minmax(140px,.78fr) minmax(160px,.95fr) 110px;
}
.record-head{
  margin:8px 8px 0;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:visible;
  position:relative;
  z-index:200;
  font-size:13px;
  font-weight:800;
}
.record-head > div{
  padding:10px 12px;
  border-right:1px solid #f1e8e2;
}
.record-head > div:first-child{
  border-radius:11px 0 0 11px;
}
.record-head > div:last-child{
  border-radius:0 11px 11px 0;
}
.head-cell{
  display:flex;
  flex-direction:column;
  gap:7px;
  min-width:0;
}
.head-label{
  font-size:13px;
  font-weight:900;
}
.head-filter-row{
  display:flex;
  gap:6px;
  min-width:0;
}
.head-select{
  min-width:0;
  width:100%;
  height:30px;
  border:1px solid rgba(160,140,145,.18);
  background:rgba(255,255,255,.72);
  border-radius:9px;
  padding:0 8px;
  font-size:11px;
  color:#596171;
  outline:none;
}
.head-select:focus{border-color:var(--pink)}
.head-search{
  width:100%;
  min-width:0;
  height:30px;
  border:1px solid rgba(160,140,145,.18);
  background:rgba(255,255,255,.78);
  border-radius:9px;
  padding:0 8px;
  font-size:11px;
  color:#596171;
  outline:none;
}
.head-search:focus{border-color:var(--pink);background:#fff}
.multi-filter{
  position:relative;
  min-width:0;
  width:100%;
}
.multi-filter summary{
  list-style:none;
  cursor:pointer;
  min-width:0;
  width:100%;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  border:1px solid rgba(160,140,145,.18);
  background:rgba(255,255,255,.72);
  border-radius:9px;
  padding:0 8px;
  font-size:11px;
  color:#596171;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.multi-filter summary::-webkit-details-marker{display:none}
.multi-filter summary::after{
  content:"⌄";
  flex:0 0 auto;
  color:#7b8390;
}
.multi-filter[open] summary{
  border-color:var(--pink);
  background:#fff;
}
.multi-options{
  position:absolute;
  left:0;
  top:calc(100% + 5px);
  z-index:300;
  width:max(100%, 300px);
  max-width:min(440px, calc(100vw - 32px));
  max-height:min(560px, calc(100vh - 170px));
  overflow:auto;
  overscroll-behavior:contain;
  scrollbar-gutter:stable;
  padding:7px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 12px 28px rgba(70,55,65,.14);
}
.multi-option{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 8px;
  border-radius:8px;
  font-size:11px;
  font-weight:500;
  color:#4f5664;
  cursor:pointer;
}
.multi-option:hover{background:#fff5f8}
.multi-option input{
  width:15px;
  height:15px;
  margin:0;
  flex:0 0 auto;
  accent-color:var(--pink-deep);
}
.multi-option span{
  min-width:0;
  overflow-wrap:anywhere;
}
.multi-empty{
  padding:9px 8px;
  font-size:11px;
  color:var(--muted);
}
.reset-filter{
  width:100%;
  height:30px;
  border:1px solid rgba(160,140,145,.18);
  background:rgba(255,255,255,.72);
  border-radius:9px;
  font-size:11px;
  color:#596171;
  cursor:pointer;
  font-weight:800;
}
.reset-filter:hover{background:#fff}
.mobile-filters{
  display:none;
}

.record-head > div:nth-child(1){background:var(--pink-soft)}
.record-head > div:nth-child(2){background:var(--blue)}
.record-head > div:nth-child(3){background:#ffeaf1}
.record-head > div:nth-child(4){background:#fff2c9}
.record-head > div:nth-child(5){background:#eef8ff}
.record-head > div:nth-child(6){background:var(--cream);border-right:none}
.record-list{
  display:grid;
  gap:12px;
  padding:10px 8px 8px;
  background:#fffaf7;
}
.site-record{
  display:block;
  background:#fffdfb;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(80,65,75,.035);
}
.site-summary{
  display:grid;
  grid-template-columns:minmax(180px,.95fr) minmax(260px,1.55fr) auto;
  gap:16px;
  align-items:center;
  min-height:58px;
  padding:11px 14px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,#fffafd 0%,#fffdfb 55%,#fffdf7 100%);
}
.site-name{
  font-weight:900;
  font-size:15px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  min-width:0;
}
.mini-check{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:28px;
  height:20px;
  padding:0 7px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  line-height:1;
}
.mini-check.yes{background:var(--mint);color:#329866}
.mini-check.conditional{background:#fff1c9;color:#a87818}
.mini-check.no{background:#ffe0e7;color:#d85b7b}
.site-url{
  min-width:0;
}
.site-url a{
  color:#4aa2dd;
  text-decoration:none;
  word-break:break-all;
  font-size:12px;
}
.site-controls{
  display:flex;
  flex-direction:row;
  gap:8px;
  align-items:center;
  justify-content:flex-end;
}
.model-table{
  display:block;
}
.model-table-head-row,
.model-data-row{
  display:grid;
  grid-template-columns:minmax(220px,1.4fr) minmax(90px,.48fr) minmax(100px,.62fr) minmax(120px,.72fr) minmax(180px,1fr);
}
.model-table-head{
  padding:8px 12px;
  font-size:11px;
  font-weight:900;
  color:#687080;
  border-bottom:1px solid var(--line);
  border-right:1px solid #f1e8e2;
}
.model-table-head:last-child{border-right:none}
.model-table-head.model-head{background:#fff4f7}
.model-table-head.price-head{background:#fff7d9}
.model-table-head.speed-head{background:#eef8ff}
.model-table-head.tags-head{background:#f3f0ff}
.model-table-head.note-head{background:#fff5eb}
.model-cell,
.price-cell,
.speed-cell,
.tags-cell,
.note-cell{
  min-width:0;
  min-height:42px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  border-bottom:1px solid #f1e8e2;
  border-right:1px solid #f1e8e2;
  font-size:13px;
  overflow-wrap:anywhere;
}
.note-cell{border-right:none}
.model-cell{font-weight:500}
.price-cell{font-weight:800;background:#fffdf7}
.speed-cell{background:#fbfdff}
.tags-cell{background:#fdfcff}
.note-cell{background:#fffdfb;color:#596171}
.model-data-row.last-row > div{border-bottom:none}
.model-details-toggle,
.model-meta-full{display:none}
.pair-empty{color:var(--muted);font-weight:400}
.model-toggle{
  grid-column:1/-1;
  width:100%;
  height:36px;
  border:0;
  border-top:1px solid var(--line);
  background:#fffaf4;
  color:#9b6a78;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}
.model-toggle:hover{background:#fff4ef}
.modal-backdrop{
  position:fixed;inset:0;
  background:rgba(50,40,50,.22);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:20;
}
.modal-backdrop.open{display:flex}
.editor{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fffdfb;
  border-radius:22px;
  box-shadow:0 24px 60px rgba(61,44,55,.18);
  padding:18px;
}
.editor-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.editor-title{font-size:18px;font-weight:900}
.close-btn{
  border:0;background:#f4f5f7;border-radius:10px;
  width:36px;height:36px;cursor:pointer;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:800;color:#5a6271}
input,textarea,select{
  width:100%;
  border:1px solid var(--line);
  background:white;
  border-radius:12px;
  padding:11px 12px;
  outline:none;
}
textarea{resize:vertical;min-height:110px}
input:focus,textarea:focus,select:focus{border-color:var(--pink)}
.seg{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.seg button{
  border:1px solid var(--line);
  background:#f7f7f8;
  border-radius:12px;
  padding:10px;
  cursor:pointer;
}
.seg button.active{
  background:var(--pink-soft);
  border-color:var(--pink);
  color:#c84f73;
  font-weight:800;
}
.save{
  width:100%;
  margin-top:16px;
  border:0;
  border-radius:14px;
  padding:12px;
  color:white;
  background:linear-gradient(135deg,var(--pink),var(--pink-deep));
  font-weight:900;
  cursor:pointer;
}
.hint{
  font-size:11px;color:var(--muted);margin-top:4px;
}
.model-price-list{display:grid;gap:8px}
.model-price-row{
  display:grid;
  grid-template-columns:minmax(0,1.4fr) minmax(120px,.7fr) 38px;
  gap:8px;
  align-items:center;
  padding:10px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fffdfa;
}
.model-price-row select,.model-price-row input{min-width:0}
.custom-model-input{
  grid-column:1 / 3;
  display:none;
  border-color:var(--pink)!important;
  background:#fffafd!important;
}
.custom-model-input.show{display:block}
.model-extra-fields{
  grid-column:1 / 3;
  display:grid;
  grid-template-columns:minmax(0,.75fr) minmax(0,1fr) minmax(0,1.4fr);
  gap:8px;
}
.model-extra-fields input{font-size:13px}
.remove-pair{
  width:38px;height:38px;border:0;border-radius:11px;
  background:#ffe7ed;color:#d95f80;cursor:pointer;font-weight:900;
}
.add-pair{
  margin-top:8px;border:1px dashed var(--pink);border-radius:12px;
  background:var(--pink-soft);color:#c84f73;padding:9px 12px;
  font-weight:800;cursor:pointer;
}
.footer{
  padding:12px 18px 16px;
  font-size:12px;
  color:var(--muted);
  border-radius:0 0 28px 28px;
}
@media (max-width:760px){
  body{background:#fff9f4}
  .app{
    width:100%;
    margin:0;
    border-radius:0;
    min-height:100vh;
    box-shadow:none;
    border:0;
    overflow:visible;
  }
  .toolbar{border-radius:0}
  .footer{border-radius:0}
  .toolbar{
    padding:12px;
    position:sticky;
    top:0;z-index:5;
  }
  .brand{font-size:17px}
  .brand::before{width:29px;height:29px;margin-right:6px}
  .toolbar{gap:8px}
  .toolbar-actions{gap:6px}
  .backup-btn{
    width:38px;height:38px;padding:0;border-radius:12px;
    font-size:0;position:relative;
  }
  .backup-btn::after{
    font-size:15px;
    position:absolute;inset:0;
    display:grid;place-items:center;
  }
  #exportBtn::after{content:"↓"}
  #importBtn::after{content:"↑"}
  .add-btn{
    width:42px;height:42px;padding:0;border-radius:13px;
    font-size:0;position:relative;flex:0 0 auto;
  }
  .add-btn::after{content:"+";font-size:24px;position:absolute;inset:0;display:grid;place-items:center}
  .record-head{display:none}
  .mobile-filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    background:#fffaf7;
  }
  .mobile-filters select,
  .mobile-filters button,
  .mobile-filters .text-search{
    width:100%;
    min-width:0;
    height:38px;
    border:1px solid var(--line);
    border-radius:11px;
    background:#fff;
    padding:0 9px;
    font-size:12px;
    color:#596171;
  }
  .mobile-filters .multi-filter{min-width:0}
  .mobile-filters .multi-filter summary{
    height:38px;
    border:1px solid var(--line);
    border-radius:11px;
    background:#fff;
    padding:0 9px;
    font-size:12px;
  }
  .mobile-filters .multi-options{
    width:min(340px, calc(100vw - 24px));
    max-width:calc(100vw - 24px);
    max-height:min(62vh, 520px);
  }
  .mobile-filters .wide{grid-column:1/-1}
  .mobile-filters button{
    background:var(--cream);
    font-weight:800;
    cursor:pointer;
  }
  .record-list{
    padding:10px;
    gap:10px;
    background:transparent;
  }
  .site-record{
    position:relative;
    border-radius:18px;
    box-shadow:0 6px 16px rgba(80,65,75,.05);
  }
  .site-summary{
    display:block;
    min-height:78px;
    padding:12px 96px 10px 12px;
    background:#fffdfb;
  }
  .site-name{
    font-size:16px;
    margin-bottom:5px;
  }
  .site-url a{
    font-size:12px;
  }
  .site-controls{
    position:absolute;
    top:10px;
    right:8px;
    gap:6px;
  }
  .model-table-head-row{display:none}
  .model-data-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) 92px;
    border-bottom:1px solid var(--line);
  }
  .model-data-row.last-row{border-bottom:none}
  .model-cell,
  .price-cell,
  .speed-cell,
  .tags-cell,
  .note-cell{
    min-height:42px;
    padding:10px 12px;
    border-bottom:0;
  }
  .model-cell{
    grid-column:1;
    border-right:1px solid var(--line);
    padding:0 2px 0 12px;
    gap:6px;
  }
  .model-name-text{
    flex:1;
    min-width:0;
    padding:10px 0;
  }
  .model-details-toggle{
    display:grid;
    place-items:center;
    flex:0 0 36px;
    width:36px;
    min-height:44px;
    align-self:stretch;
    padding:0;
    border:0;
    border-radius:8px;
    background:transparent;
    color:#9b7f8a;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .model-details-arrow{
    width:0;
    height:0;
    border-left:4px solid transparent;
    border-right:4px solid transparent;
    border-top:5px solid currentColor;
  }
  .model-details-toggle[aria-expanded="true"] .model-details-arrow{
    transform:rotate(180deg);
  }
  .model-details-toggle:focus-visible{
    outline:2px solid var(--pink-deep);
    outline-offset:-2px;
  }
  .price-cell{grid-column:2;border-right:none}
  .model-data-row > .speed-cell,
  .model-data-row > .tags-cell,
  .model-data-row > .note-cell{display:none}
  .model-meta-full:not([hidden]){
    display:grid;
    grid-column:1/-1;
    grid-template-columns:max-content minmax(0,1fr);
    min-width:0;
    gap:8px;
    margin:0;
    padding:10px 12px 12px;
    border-top:1px dashed #eee3dd;
    background:#fffdfa;
    color:#596171;
    font-size:12px;
    line-height:1.6;
  }
  .model-meta-full dt{color:var(--muted);font-weight:800}
  .model-meta-full dd{
    margin:0;
    min-width:0;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    -webkit-user-select:text;
    user-select:text;
  }
  .site-controls .del{
    display:grid;
    place-items:center;
    padding:0;
    line-height:1;
  }
  .modal-backdrop{
    align-items:flex-end;
    padding:0;
  }
  .editor{
    width:100%;
    max-height:88vh;
    border-radius:22px 22px 0 0;
    padding:18px 14px calc(16px + env(safe-area-inset-bottom));
    animation:slideUp .18s ease-out;
  }
  .editor::before{
    content:"";
    display:block;
    width:44px;height:5px;border-radius:999px;
    background:#ddd4d0;
    margin:-6px auto 12px;
  }
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  input,textarea,select{font-size:16px}
  .model-price-row{
    grid-template-columns:minmax(0,1fr) 38px;
    padding:9px;
  }
  .model-price-row .price-input{grid-column:1}
  .model-price-row .remove-pair{
    grid-column:2;grid-row:1 / span 3;height:100%;min-height:82px;
  }
  .custom-model-input{grid-column:1}
  .model-extra-fields{
    grid-column:1;
    grid-template-columns:1fr;
  }
  .save{padding:14px}
  @keyframes slideUp{
    from{transform:translateY(16px);opacity:.4}
    to{transform:translateY(0);opacity:1}
  }
}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="brand">API 小记录</div>
    <div class="toolbar-actions">
      <button class="backup-btn" id="exportBtn" title="导出 JSON">导出</button>
      <button class="backup-btn" id="importBtn" title="导入 JSON">导入</button>
      <button class="add-btn" id="addBtn">+ 添加</button>
    </div>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
  </div>

  <div class="record-head">
    <div class="head-cell">
      <div class="head-label">网站名</div>
      <details class="multi-filter" data-multi-filter="sites">
        <summary data-multi-summary="sites">全部站点</summary>
        <div class="multi-options" data-multi-options="sites"></div>
      </details>
    </div>
    <div class="head-cell">
      <div class="head-label">签到</div>
      <select class="head-select filter-control" data-filter="check">
        <option value="all">全部</option>
        <option value="yes">有</option>
        <option value="conditional">有条件</option>
        <option value="no">无</option>
      </select>
    </div>
    <div class="head-cell">
      <div class="head-label">主要模型</div>
      <details class="multi-filter" data-multi-filter="models">
        <summary data-multi-summary="models">全部模型</summary>
        <div class="multi-options" data-multi-options="models"></div>
      </details>
    </div>
    <div class="head-cell">
      <div class="head-label">价格</div>
      <select class="head-select filter-control" data-filter="priceSort">
        <option value="none">默认顺序</option>
        <option value="asc">价格低→高</option>
        <option value="desc">价格高→低</option>
      </select>
    </div>
    <div class="head-cell">
      <div class="head-label">搜索</div>
      <input class="head-search text-search" type="search" placeholder="任意文本">
    </div>
    <div class="head-cell">
      <div class="head-label">操作</div>
      <button class="reset-filter" type="button" data-reset-filters>重置筛选</button>
    </div>
  </div>

  <div class="mobile-filters">
    <details class="multi-filter" data-multi-filter="sites">
      <summary data-multi-summary="sites">全部站点</summary>
      <div class="multi-options" data-multi-options="sites"></div>
    </details>
    <select class="filter-control" data-filter="check">
      <option value="all">签到：全部</option>
      <option value="yes">签到：有</option>
      <option value="conditional">签到：有条件</option>
      <option value="no">签到：无</option>
    </select>
    <details class="multi-filter wide" data-multi-filter="models">
      <summary data-multi-summary="models">全部模型</summary>
      <div class="multi-options" data-multi-options="models"></div>
    </details>
    <select class="filter-control" data-filter="priceSort">
      <option value="none">价格默认</option>
      <option value="asc">价格低→高</option>
      <option value="desc">价格高→低</option>
    </select>
    <input class="text-search" type="search" placeholder="搜索任意文本">
    <button class="wide" type="button" data-reset-filters>重置筛选</button>
  </div>

  <div class="record-list" id="recordList"></div>
  <div class="footer" id="count"></div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="editor">
    <div class="editor-head">
      <div class="editor-title" id="editorTitle">添加条目</div>
      <button class="close-btn" id="closeBtn">×</button>
    </div>
    <div class="form-grid">
      <div class="field">
        <label>网站名</label>
        <input id="name" placeholder="例如：OpenAI">
      </div>
      <div class="field">
        <label>网址</label>
        <input id="url" placeholder="https://...">
      </div>
      <div class="field">
        <label>签到</label>
        <div class="seg">
          <button type="button" id="checkYes">有</button>
          <button type="button" id="checkConditional">有条件</button>
          <button type="button" id="checkNo">无</button>
        </div>
      </div>
      <div class="field full">
        <label>模型 / 价格 / 速度 / 标签 / 备注</label>
        <div class="model-price-list" id="modelPriceList"></div>
        <button class="add-pair" type="button" id="addModelBtn">＋ 添加模型</button>
      </div>
    </div>
    <button class="save" id="saveBtn">保存</button>
  </div>
</div>

<script>
const MODEL_OPTIONS = [
  "claude-opus-4-8",
  "claude-opus-5",
  "deepseek-v4-flash",
  "deepseek-v4-pro",
  "deepseek-v4.1-flash",
  "gemini-3.1-pro-preview",
  "gemini-3.5-flash",
  "gemini-3.6-flash",
  "gemini-3.7-flash",
  "gemini-3.8-flash",
  "glm-5.2",
  "glm-5.3",
  "gpt-4o-2024-11-20",
  "gpt-4.1",
  "gpt-5.5",
  "gpt-5.6-sol",
  "grok-4.6",
  "grok-4.7",
  "kimi-k3"
];

const seed = [
  {name:"OpenAI",url:"https://openai.com",check:true,modelPrices:[
    {model:"gpt-4o-2024-11-20",price:"价格待记录"},
    {model:"gpt-5.6-sol",price:"价格待记录"}
  ]},
  {name:"Anthropic",url:"https://anthropic.com",check:false,modelPrices:[
    {model:"claude-opus-4-8",price:"价格待记录"},
    {model:"claude-opus-5",price:"价格待记录"}
  ]},
  {name:"Google AI",url:"https://ai.google.dev",check:true,modelPrices:[
    {model:"gemini-3.1-pro-preview",price:"价格待记录"},
    {model:"gemini-3.5-flash",price:"价格待记录"}
  ]}
]

function normalizeModelPrices(item){
  if(Array.isArray(item?.modelPrices)){
    return item.modelPrices.map(x=>({
      model:String(x?.model ?? "").trim(),
      price:String(x?.price ?? "").trim(),
      speed:String(x?.speed ?? "").trim(),
      tags:String(x?.tags ?? x?.tag ?? "").trim(),
      note:String(x?.note ?? x?.remark ?? "").trim()
    })).filter(x=>x.model || x.price || x.speed || x.tags || x.note);
  }
  if(typeof item?.models === "string" && item.models.trim()){
    return item.models.split("\n").filter(Boolean).map(line=>{
      const parts = line.split(/｜|\|/);
      return {
        model:(parts.shift() || "").trim(),
        price:parts.join("｜").trim(),
        speed:"",
        tags:"",
        note:""
      };
    });
  }
  return [];
}
function normalizeCheck(value){
  if(value === true || value === "yes" || value === "有") return "yes";
  if(value === "conditional" || value === "有条件") return "conditional";
  return "no";
}
function normalizeRecord(item){
  return {
    name:String(item?.name ?? "").trim() || "未命名",
    url:String(item?.url ?? "").trim(),
    check:normalizeCheck(item?.check),
    modelPrices:normalizeModelPrices(item)
  };
}
const stored = JSON.parse(localStorage.getItem("api-records-demo") || "null");
let rows = Array.isArray(stored) ? stored.map(normalizeRecord) : seed.map(normalizeRecord);
let editingIndex = null;
let checkValue = "yes";

const $ = id => document.getElementById(id);
const recordList = $("recordList");
const expandedSites = new Set();
const COLLAPSED_MODEL_LIMIT = 7;

const filterState = {
  sites:[],
  check:"all",
  models:[],
  priceSort:"none",
  search:""
};

function esc(s=""){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function parsePrice(value){
  const text = String(value ?? "").replace(/,/g,"");
  const match = text.match(/-?\d+(?:\.\d+)?/);
  return match ? Number(match[0]) : null;
}
function sortPriceForRecord(record){
  const nums = (record.visiblePairs || [])
    .map(x=>parsePrice(x.price))
    .filter(x=>Number.isFinite(x));
  if(!nums.length) return null;
  return filterState.priceSort === "desc" ? Math.max(...nums) : Math.min(...nums);
}
function multiSummaryText(kind){
  const selected = filterState[kind];
  if(!selected.length) return kind==="sites" ? "全部站点" : "全部模型";
  if(selected.length===1) return selected[0];
  return `已选 ${selected.length} 个${kind==="sites" ? "站点" : "模型"}`;
}
function renderMultiOptions(kind, values){
  const selected = filterState[kind];
  const content = values.length
    ? values.map(value=>`
        <label class="multi-option">
          <input type="checkbox" data-multi-kind="${kind}" value="${esc(value)}" ${selected.includes(value) ? "checked" : ""}>
          <span>${esc(value)}</span>
        </label>
      `).join("")
    : '<div class="multi-empty">暂无可选项</div>';

  document.querySelectorAll(`[data-multi-options="${kind}"]`).forEach(box=>{
    box.innerHTML = content;
  });
  document.querySelectorAll(`[data-multi-summary="${kind}"]`).forEach(summary=>{
    summary.textContent = multiSummaryText(kind);
  });
}
function syncMultiFilterUI(kind){
  const selected = filterState[kind];
  document.querySelectorAll(`[data-multi-kind="${kind}"]`).forEach(input=>{
    input.checked = selected.includes(input.value);
  });
  document.querySelectorAll(`[data-multi-summary="${kind}"]`).forEach(summary=>{
    summary.textContent = multiSummaryText(kind);
  });
}
function syncSimpleFilterUI(){
  document.querySelectorAll('[data-filter="check"]').forEach(el=>el.value=filterState.check);
  document.querySelectorAll('[data-filter="priceSort"]').forEach(el=>el.value=filterState.priceSort);
  document.querySelectorAll('.text-search').forEach(el=>{
    if(el.value !== filterState.search) el.value = filterState.search;
  });
}
function refreshFilterOptions(){
  const siteNames = [...new Set(rows.map(r=>r.name).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"zh-CN"));
  const modelNames = [...new Set([
    ...MODEL_OPTIONS,
    ...rows.flatMap(r=>(r.modelPrices || []).map(x=>x.model)).filter(Boolean)
  ])].sort((a,b)=>a.localeCompare(b,"en"));

  filterState.sites = filterState.sites.filter(name=>siteNames.includes(name));
  filterState.models = filterState.models.filter(name=>modelNames.includes(name));

  renderMultiOptions("sites", siteNames);
  renderMultiOptions("models", modelNames);
  syncSimpleFilterUI();
}
function render(refreshFilters=true){
  if(refreshFilters) refreshFilterOptions();
  else{
    syncMultiFilterUI("sites");
    syncMultiFilterUI("models");
    syncSimpleFilterUI();
  }

  const query = filterState.search.trim().toLowerCase();

  let filtered = rows
    .map((r,i)=>{
      const basePairs = filterState.models.length
        ? (r.modelPrices || []).filter(x=>filterState.models.includes(x.model))
        : [...(r.modelPrices || [])];

      const siteText = [
        r.name,
        r.url,
        r.check === "yes"
          ? "有 签到"
          : r.check === "conditional"
            ? "有条件 条件签到"
            : "无 不签到"
      ].join(" ").toLowerCase();

      const siteMatchesSearch = !query || siteText.includes(query);
      const searchPairs = !query || siteMatchesSearch
        ? basePairs
        : basePairs.filter(x=>[
            x.model,x.price,x.speed,x.tags,x.note
          ].join(" ").toLowerCase().includes(query));

      return {
        ...r,
        _i:i,
        visiblePairs:searchPairs,
        siteMatchesSearch
      };
    })
    .filter(r => !filterState.sites.length || filterState.sites.includes(r.name))
    .filter(r => filterState.check==="all" || r.check===filterState.check)
    .filter(r => !filterState.models.length || r.visiblePairs.length>0)
    .filter(r => !query || r.siteMatchesSearch || r.visiblePairs.length>0);

  if(filterState.priceSort!=="none"){
    filtered.sort((a,b)=>{
      const av = sortPriceForRecord(a);
      const bv = sortPriceForRecord(b);
      if(av===null && bv===null) return a._i-b._i;
      if(av===null) return 1;
      if(bv===null) return -1;
      return filterState.priceSort==="asc" ? av-bv : bv-av;
    });
  }

  recordList.innerHTML = filtered.length ? filtered.map(r => {
    let pairs = r.visiblePairs.length ? [...r.visiblePairs] : [{model:"",price:""}];

    if(filterState.priceSort!=="none"){
      pairs.sort((a,b)=>{
        const av = parsePrice(a.price);
        const bv = parsePrice(b.price);
        if(av===null && bv===null) return 0;
        if(av===null) return 1;
        if(bv===null) return -1;
        return filterState.priceSort==="asc" ? av-bv : bv-av;
      });
    }

    const canCollapse = !filterState.models.length && !query && pairs.length > COLLAPSED_MODEL_LIMIT;
    const isExpanded = expandedSites.has(r._i);
    const shownPairs = canCollapse && !isExpanded
      ? pairs.slice(0, COLLAPSED_MODEL_LIMIT)
      : pairs;

    const pairHtml = shownPairs.map((x,idx) => {
      const isLast = idx===shownPairs.length-1 && !canCollapse;
      const metaId = `model-meta-${r._i}-${idx}`;
      return `
        <div class="model-data-row ${isLast ? "last-row" : ""}">
          <div class="model-cell ${x.model ? "" : "pair-empty"}">
            <span class="model-name-text">${esc(x.model || "—")}</span>
            <button class="model-details-toggle" type="button" aria-label="展开模型详情"
                    aria-expanded="false" aria-controls="${metaId}" onclick="toggleModelDetails(this)">
              <span class="model-details-arrow" aria-hidden="true"></span>
            </button>
          </div>
          <div class="price-cell ${x.price ? "" : "pair-empty"}">${esc(x.price || "—")}</div>
          <div class="speed-cell ${x.speed ? "" : "pair-empty"}">${esc(x.speed || "—")}</div>
          <div class="tags-cell ${x.tags ? "" : "pair-empty"}">${esc(x.tags || "—")}</div>
          <div class="note-cell ${x.note ? "" : "pair-empty"}">${esc(x.note || "—")}</div>
          <dl class="model-meta-full" id="${metaId}" hidden>
            <dt>速度</dt><dd>${esc(x.speed || "—")}</dd>
            <dt>标签</dt><dd>${esc(x.tags || "—")}</dd>
            <dt>备注</dt><dd>${esc(x.note || "—")}</dd>
          </dl>
        </div>
      `;
    }).join("");

    const toggleHtml = canCollapse
      ? `<button class="model-toggle" type="button" onclick="toggleSiteModels(${r._i})">${isExpanded ? "收起模型" : `展开其余 ${pairs.length-COLLAPSED_MODEL_LIMIT} 个模型`}</button>`
      : "";

    return `
      <div class="site-record">
        <div class="site-summary">
          <div class="site-name">
            <span>${esc(r.name)}</span>
            <span class="mini-check ${r.check}">${r.check==="yes" ? "有" : r.check==="conditional" ? "有条件" : "无"}</span>
          </div>
          <div class="site-url">
            <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>
          </div>
          <div class="site-controls">
            <button class="icon-btn edit" onclick="editRow(${r._i})" title="编辑">✎</button>
            <button class="icon-btn del" onclick="deleteRow(${r._i})" title="删除">×</button>
          </div>
        </div>

        <div class="model-table">
          <div class="model-table-head-row">
            <div class="model-table-head model-head">主要模型</div>
            <div class="model-table-head price-head">价格</div>
            <div class="model-table-head speed-head">速度</div>
            <div class="model-table-head tags-head">标签</div>
            <div class="model-table-head note-head">备注</div>
          </div>
          ${pairHtml}
          ${toggleHtml}
        </div>
      </div>
    `;
  }).join("") : `<div class="empty">暂无符合筛选条件的条目</div>`;

  $("count").textContent = `共 ${filtered.length} 条记录`;
  localStorage.setItem("api-records-demo", JSON.stringify(rows));
}
// Toggle only this rendered model row; keep records and filter menus untouched.
window.toggleModelDetails = function(button){
  const panel = button.closest(".model-data-row")?.querySelector(".model-meta-full");
  if(!panel) return;
  const expanded = panel.hidden;
  panel.hidden = !expanded;
  button.setAttribute("aria-expanded", String(expanded));
  button.setAttribute("aria-label", expanded ? "收起模型详情" : "展开模型详情");
};
function setCheck(v){
  checkValue = normalizeCheck(v);
  $("checkYes").classList.toggle("active", checkValue==="yes");
  $("checkConditional").classList.toggle("active", checkValue==="conditional");
  $("checkNo").classList.toggle("active", checkValue==="no");
}
function modelOptionsHtml(selected=""){
  const isCustom = Boolean(selected && !MODEL_OPTIONS.includes(selected));
  const base = '<option value="">选择模型</option>';
  const preset = MODEL_OPTIONS
    .map(m=>`<option value="${esc(m)}" ${m===selected?"selected":""}>${esc(m)}</option>`)
    .join("");
  const custom = `<option value="__custom__" ${isCustom?"selected":""}>＋ 自定义模型名称</option>`;
  return base + preset + custom;
}
function addModelPriceRow(item={model:"",price:""}){
  const wrap = document.createElement("div");
  wrap.className = "model-price-row";
  const isCustom = Boolean(item.model && !MODEL_OPTIONS.includes(item.model));
  wrap.innerHTML = `
    <select class="model-select">${modelOptionsHtml(item.model || "")}</select>
    <input class="price-input" placeholder="价格" value="${esc(item.price || "")}">
    <button class="remove-pair" type="button" title="删除">×</button>
    <input class="custom-model-input ${isCustom ? "show" : ""}" placeholder="输入自定义模型名称" value="${isCustom ? esc(item.model) : ""}">
    <div class="model-extra-fields">
      <input class="speed-input" placeholder="速度" value="${esc(item.speed || "")}">
      <input class="tags-input" placeholder="标签" value="${esc(item.tags || "")}">
      <input class="note-input" placeholder="备注" value="${esc(item.note || "")}">
    </div>
  `;

  const select = wrap.querySelector(".model-select");
  const customInput = wrap.querySelector(".custom-model-input");

  select.addEventListener("change", ()=>{
    const customMode = select.value === "__custom__";
    customInput.classList.toggle("show", customMode);
    if(customMode){
      setTimeout(()=>customInput.focus(), 0);
    }else{
      customInput.value = "";
    }
  });

  wrap.querySelector(".remove-pair").onclick = ()=>wrap.remove();
  $("modelPriceList").appendChild(wrap);
}
function getEditorModelPrices(){
  return [...$("modelPriceList").querySelectorAll(".model-price-row")].map(row=>{
    const selectValue = row.querySelector(".model-select").value.trim();
    const customValue = row.querySelector(".custom-model-input").value.trim();
    return {
      model:selectValue === "__custom__" ? customValue : selectValue,
      price:row.querySelector(".price-input").value.trim(),
      speed:row.querySelector(".speed-input").value.trim(),
      tags:row.querySelector(".tags-input").value.trim(),
      note:row.querySelector(".note-input").value.trim()
    };
  }).filter(x=>x.model || x.price || x.speed || x.tags || x.note);
}
function openEditor(data=null,index=null){
  editingIndex = index;
  $("editorTitle").textContent = index===null ? "添加条目" : "编辑条目";
  $("name").value = data?.name || "";
  $("url").value = data?.url || "";
  $("modelPriceList").innerHTML = "";
  const pairs = data ? normalizeModelPrices(data) : [];
  (pairs.length ? pairs : [{model:"",price:""}]).forEach(addModelPriceRow);
  setCheck(data?.check ?? "yes");
  $("modal").classList.add("open");
  document.body.classList.add("modal-open");
  setTimeout(()=>$("name").focus(),50);
}
function closeEditor(){
  $("modal").classList.remove("open");
  document.body.classList.remove("modal-open");
}
window.toggleSiteModels = function(i){
  if(expandedSites.has(i)) expandedSites.delete(i);
  else expandedSites.add(i);
  render();
}
window.editRow = function(i){openEditor(rows[i],i)}
window.deleteRow = function(i){
  if(confirm("删除这条记录？")){
    rows.splice(i,1);
    expandedSites.clear();
    render(true);
  }
}
$("addBtn").onclick = ()=>openEditor();
$("closeBtn").onclick = closeEditor;
$("checkYes").onclick = ()=>setCheck("yes");
$("checkConditional").onclick = ()=>setCheck("conditional");
$("checkNo").onclick = ()=>setCheck("no");
$("addModelBtn").onclick = ()=>addModelPriceRow();

document.querySelectorAll(".text-search").forEach(input=>{
  input.addEventListener("input", e=>{
    filterState.search = e.target.value;
    render(false);
  });
});
document.querySelectorAll(".filter-control").forEach(control=>{
  control.addEventListener("change", e=>{
    const key = e.target.dataset.filter;
    filterState[key] = e.target.value;
    render(false);
  });
});
document.addEventListener("change", e=>{
  const input = e.target.closest("[data-multi-kind]");
  if(!input) return;

  const kind = input.dataset.multiKind;
  const selected = new Set(filterState[kind]);

  if(input.checked) selected.add(input.value);
  else selected.delete(input.value);

  filterState[kind] = [...selected];
  syncMultiFilterUI(kind);
  render(false);
});
document.querySelectorAll("[data-reset-filters]").forEach(button=>{
  button.addEventListener("click", ()=>{
    filterState.sites = [];
    filterState.check = "all";
    filterState.models = [];
    filterState.priceSort = "none";
    filterState.search = "";
    document.querySelectorAll(".multi-filter[open]").forEach(el=>el.open=false);
    render(false);
  });
});
document.addEventListener("click", e=>{
  if(e.target.closest(".multi-filter")) return;
  document.querySelectorAll(".multi-filter[open]").forEach(el=>el.open=false);
});

$("exportBtn").onclick = ()=>{
  const backup = {
    version: 5,
    exportedAt: new Date().toISOString(),
    records: rows
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const date = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `api-site-record-backup-${date}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
};

$("importBtn").onclick = ()=>$("importFile").click();

$("importFile").addEventListener("change", async e=>{
  const file = e.target.files?.[0];
  e.target.value = "";
  if(!file) return;

  try{
    const parsed = JSON.parse(await file.text());
    const incoming = Array.isArray(parsed) ? parsed : parsed?.records;
    if(!Array.isArray(incoming)) throw new Error("格式错误");

    const normalized = incoming.map(normalizeRecord);

    if(!confirm(`导入 ${normalized.length} 条记录并覆盖当前 ${rows.length} 条记录？`)) return;

    rows = normalized;
    expandedSites.clear();
    render(true);
    alert("导入完成");
  }catch(err){
    alert("导入失败：请选择本网站导出的 JSON 备份文件。");
  }
});

$("saveBtn").onclick = ()=>{
  const item = {
    name:$("name").value.trim() || "未命名",
    url:$("url").value.trim(),
    check:checkValue,
    modelPrices:getEditorModelPrices()
  };
  if(editingIndex===null) rows.unshift(item);
  else rows[editingIndex]=item;
  expandedSites.clear();
  closeEditor();
  render(true);
};
render(true);
</script>
</body>
</html>
