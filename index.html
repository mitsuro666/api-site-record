<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>API 小记录</title>
<style>
:root{
  --bg:#fff9f4;
  --paper:#fffdf9;
  --pink:#f7a9bd;
  --pink-deep:#ef7fa0;
  --pink-soft:#fde8ef;
  --blue:#dff1ff;
  --blue-deep:#8ec8ef;
  --yellow:#fff0bd;
  --cream:#fff6df;
  --mint:#dff5e9;
  --text:#2e3443;
  --muted:#7f8796;
  --line:#eadfd8;
  --shadow:0 14px 40px rgba(110,85,95,.10);
  --radius:20px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background:
    radial-gradient(circle at 10% 0%, #ffe5ed 0 16%, transparent 36%),
    radial-gradient(circle at 100% 12%, #eaf5ff 0 14%, transparent 34%),
    linear-gradient(135deg,#fffaf5,#fffdf9);
  color:var(--text);
  min-height:100vh;
}
button,input,textarea,select{font:inherit}
.app{
  width:min(1180px, calc(100% - 28px));
  margin:26px auto;
  background:rgba(255,253,249,.94);
  border:1px solid rgba(234,223,216,.9);
  border-radius:28px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.toolbar{
  display:flex;
  gap:12px;
  align-items:center;
  padding:18px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.75);
  backdrop-filter: blur(10px);
}
.brand{
  font-weight:800;
  font-size:22px;
  letter-spacing:.02em;
  white-space:nowrap;
}
.brand::before{
  content:"♡";
  display:inline-grid;
  place-items:center;
  width:34px;height:34px;
  margin-right:8px;
  border-radius:50%;
  background:var(--pink-soft);
  color:var(--pink-deep);
}
.toolbar-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
  margin-left:auto;
}
.backup-btn{
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 13px;
  background:#fff;
  color:#596171;
  font-weight:800;
  cursor:pointer;
}
.backup-btn:hover{border-color:var(--pink);background:var(--pink-soft)}
.add-btn{
  border:0;
  border-radius:14px;
  padding:11px 17px;
  background:linear-gradient(135deg,var(--pink),var(--pink-deep));
  color:white;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 18px rgba(239,127,160,.22);
}
.table-wrap{overflow:auto}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  min-width:1040px;
}
th,td{
  padding:13px 14px;
  border-bottom:1px solid var(--line);
  border-right:1px solid #f1e8e2;
  text-align:left;
  vertical-align:top;
  background:#fffdfb;
}
th{
  position:sticky;
  top:0;
  z-index:2;
  font-size:13px;
  font-weight:800;
}
th:nth-child(1){background:var(--pink-soft)}
th:nth-child(2){background:var(--blue)}
th:nth-child(3){background:var(--yellow)}
th:nth-child(4){background:#ffeaf1}
th:nth-child(5){background:#fff2c9}
th:nth-child(6){background:#e8f3ff}
th:nth-child(7){background:var(--cream)}
td:last-child,th:last-child{border-right:none}
.url a{color:#4aa2dd;text-decoration:none;word-break:break-all}
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:46px;
  padding:5px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}
.badge.yes{background:var(--mint);color:#329866}
.badge.no{background:#ffe0e7;color:#d85b7b}
.models{
  display:flex;flex-wrap:wrap;gap:6px;
}
.tag{
  display:inline-block;
  padding:5px 8px;
  border-radius:9px;
  background:#f7f8fb;
  font-size:12px;
  line-height:1.3;
}
.actions{white-space:nowrap}
.icon-btn{
  width:34px;height:34px;
  border:0;border-radius:11px;
  cursor:pointer;
}
.edit{background:#e7f4ff;color:#2a92d5}
.del{background:#ffe7ed;color:#e65f81}
.empty{
  text-align:center;
  color:var(--muted);
  padding:38px 20px;
}
.record-head,
.site-record{
  display:grid;
  grid-template-columns:minmax(150px,1.05fr) minmax(210px,1.45fr) minmax(0,1.55fr) minmax(110px,.70fr) 96px;
}
.record-head{
  margin:8px 8px 0;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  font-size:13px;
  font-weight:800;
}
.record-head > div{
  padding:10px 12px;
  border-right:1px solid #f1e8e2;
}
.head-cell{
  display:flex;
  flex-direction:column;
  gap:7px;
  min-width:0;
}
.head-label{
  font-size:13px;
  font-weight:900;
}
.head-filter-row{
  display:flex;
  gap:6px;
  min-width:0;
}
.head-select{
  min-width:0;
  width:100%;
  height:30px;
  border:1px solid rgba(160,140,145,.18);
  background:rgba(255,255,255,.72);
  border-radius:9px;
  padding:0 8px;
  font-size:11px;
  color:#596171;
  outline:none;
}
.head-select:focus{border-color:var(--pink)}
.reset-filter{
  width:100%;
  height:30px;
  border:1px solid rgba(160,140,145,.18);
  background:rgba(255,255,255,.72);
  border-radius:9px;
  font-size:11px;
  color:#596171;
  cursor:pointer;
  font-weight:800;
}
.reset-filter:hover{background:#fff}
.mobile-filters{
  display:none;
}

.record-head > div:nth-child(1){background:var(--pink-soft)}
.record-head > div:nth-child(2){background:var(--blue)}
.record-head > div:nth-child(3){background:#ffeaf1}
.record-head > div:nth-child(4){background:#fff2c9}
.record-head > div:nth-child(5){background:var(--cream);border-right:none}
.record-list{display:grid;gap:8px;padding:8px;background:#fffaf7}
.site-record{
  background:#fffdfb;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}
.site-cell{
  padding:14px;
  border-right:1px solid #f1e8e2;
  min-width:0;
  align-self:stretch;
}
.site-name{
  font-weight:900;
  font-size:15px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.mini-check{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:28px;
  height:20px;
  padding:0 7px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  line-height:1;
}
.mini-check.yes{background:var(--mint);color:#329866}
.mini-check.no{background:#ffe0e7;color:#d85b7b}
.site-url a{
  color:#4aa2dd;
  text-decoration:none;
  word-break:break-all;
  font-size:12px;
}
.record-cell{
  min-width:0;
  padding:11px 14px;
  border-right:1px solid #f1e8e2;
  border-bottom:1px solid #f1e8e2;
  display:flex;
  align-items:center;
}
.model-cell{
  font-size:13px;
}
.price-cell{
  font-size:13px;
  font-weight:800;
  background:#fffdf7;
}
.record-cell.last-row{border-bottom:none}
.pair-empty{color:var(--muted);font-weight:400}
.site-controls{
  grid-column:5;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:center;
  justify-content:flex-start;
  background:#fffdfb;
}
.modal-backdrop{
  position:fixed;inset:0;
  background:rgba(50,40,50,.22);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:20;
}
.modal-backdrop.open{display:flex}
.editor{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fffdfb;
  border-radius:22px;
  box-shadow:0 24px 60px rgba(61,44,55,.18);
  padding:18px;
}
.editor-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.editor-title{font-size:18px;font-weight:900}
.close-btn{
  border:0;background:#f4f5f7;border-radius:10px;
  width:36px;height:36px;cursor:pointer;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:800;color:#5a6271}
input,textarea,select{
  width:100%;
  border:1px solid var(--line);
  background:white;
  border-radius:12px;
  padding:11px 12px;
  outline:none;
}
textarea{resize:vertical;min-height:110px}
input:focus,textarea:focus,select:focus{border-color:var(--pink)}
.seg{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.seg button{
  border:1px solid var(--line);
  background:#f7f7f8;
  border-radius:12px;
  padding:10px;
  cursor:pointer;
}
.seg button.active{
  background:var(--pink-soft);
  border-color:var(--pink);
  color:#c84f73;
  font-weight:800;
}
.save{
  width:100%;
  margin-top:16px;
  border:0;
  border-radius:14px;
  padding:12px;
  color:white;
  background:linear-gradient(135deg,var(--pink),var(--pink-deep));
  font-weight:900;
  cursor:pointer;
}
.hint{
  font-size:11px;color:var(--muted);margin-top:4px;
}
.model-price-list{display:grid;gap:8px}
.model-price-row{
  display:grid;
  grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 38px;
  gap:8px;
  align-items:center;
}
.model-price-row select,.model-price-row input{min-width:0}
.custom-model-input{
  grid-column:1;
  display:none;
  border-color:var(--pink)!important;
  background:#fffafd!important;
}
.custom-model-input.show{display:block}
.remove-pair{
  width:38px;height:38px;border:0;border-radius:11px;
  background:#ffe7ed;color:#d95f80;cursor:pointer;font-weight:900;
}
.add-pair{
  margin-top:8px;border:1px dashed var(--pink);border-radius:12px;
  background:var(--pink-soft);color:#c84f73;padding:9px 12px;
  font-weight:800;cursor:pointer;
}
.footer{
  padding:12px 18px 16px;
  font-size:12px;
  color:var(--muted);
}
@media (max-width:760px){
  body{background:#fff9f4}
  .app{
    width:100%;
    margin:0;
    border-radius:0;
    min-height:100vh;
    box-shadow:none;
    border:0;
  }
  .toolbar{
    padding:12px;
    position:sticky;
    top:0;z-index:5;
  }
  .brand{font-size:17px}
  .brand::before{width:29px;height:29px;margin-right:6px}
  .toolbar{gap:8px}
  .toolbar-actions{gap:6px}
  .backup-btn{
    width:38px;height:38px;padding:0;border-radius:12px;
    font-size:0;position:relative;
  }
  .backup-btn::after{
    font-size:15px;
    position:absolute;inset:0;
    display:grid;place-items:center;
  }
  #exportBtn::after{content:"↓"}
  #importBtn::after{content:"↑"}
  .add-btn{
    width:42px;height:42px;padding:0;border-radius:13px;
    font-size:0;position:relative;flex:0 0 auto;
  }
  .add-btn::after{content:"+";font-size:24px;position:absolute;inset:0;display:grid;place-items:center}
  .record-head{display:none}
  .mobile-filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    background:#fffaf7;
  }
  .mobile-filters select,
  .mobile-filters button{
    width:100%;
    min-width:0;
    height:38px;
    border:1px solid var(--line);
    border-radius:11px;
    background:#fff;
    padding:0 9px;
    font-size:12px;
    color:#596171;
  }
  .mobile-filters .wide{grid-column:1/-1}
  .mobile-filters button{
    background:var(--cream);
    font-weight:800;
    cursor:pointer;
  }
  .record-list{
    padding:10px;
    gap:10px;
    background:transparent;
  }
  .site-record{
    position:relative;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(88px,.42fr);
    border-radius:18px;
    box-shadow:0 6px 16px rgba(80,65,75,.05);
  }
  .site-cell{
    border-right:0;
    padding:12px 12px 4px;
  }
  .site-name{
    grid-column:1/-1!important;
    grid-row:auto!important;
    font-size:16px;
    padding-right:96px;
  }
  .site-url{
    grid-column:1/-1!important;
    grid-row:auto!important;
    padding-top:2px;
    padding-bottom:10px;
    padding-right:96px;
  }
  .model-cell,
  .price-cell{
    grid-row:auto!important;
    min-height:42px;
    border-top:1px solid var(--line);
    border-bottom:none;
    padding:10px 12px;
  }
  .model-cell{grid-column:1!important}
  .price-cell{grid-column:2!important;border-right:none}
  .site-controls{
    position:absolute;
    top:10px;
    right:8px;
    padding:0;
    flex-direction:row;
    background:transparent;
  }
  .site-controls .del{display:inline-grid}
  .modal-backdrop{
    align-items:flex-end;
    padding:0;
  }
  .editor{
    width:100%;
    max-height:88vh;
    border-radius:22px 22px 0 0;
    padding:18px 14px calc(16px + env(safe-area-inset-bottom));
    animation:slideUp .18s ease-out;
  }
  .editor::before{
    content:"";
    display:block;
    width:44px;height:5px;border-radius:999px;
    background:#ddd4d0;
    margin:-6px auto 12px;
  }
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  input,textarea,select{font-size:16px}
  .model-price-row{grid-template-columns:minmax(0,1fr) 38px}
  .model-price-row .price-input{grid-column:1 / 2}
  .model-price-row .remove-pair{
    grid-column:2;grid-row:1 / span 2;height:100%;min-height:82px;
  }
  .save{padding:14px}
  @keyframes slideUp{
    from{transform:translateY(16px);opacity:.4}
    to{transform:translateY(0);opacity:1}
  }
}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="brand">API 小记录</div>
    <div class="toolbar-actions">
      <button class="backup-btn" id="exportBtn" title="导出 JSON">导出</button>
      <button class="backup-btn" id="importBtn" title="导入 JSON">导入</button>
      <button class="add-btn" id="addBtn">+ 添加</button>
    </div>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
  </div>

  <div class="record-head">
    <div class="head-cell">
      <div class="head-label">网站名</div>
      <div class="head-filter-row">
        <select class="head-select filter-control" data-filter="site">
          <option value="">全部站点</option>
        </select>
        <select class="head-select filter-control" data-filter="check">
          <option value="all">签到：全部</option>
          <option value="yes">签到：有</option>
          <option value="no">签到：无</option>
        </select>
      </div>
    </div>
    <div class="head-cell">
      <div class="head-label">网址</div>
      <select class="head-select filter-control" data-filter="urlSort">
        <option value="none">默认顺序</option>
        <option value="asc">网址 A→Z</option>
        <option value="desc">网址 Z→A</option>
      </select>
    </div>
    <div class="head-cell">
      <div class="head-label">主要模型</div>
      <select class="head-select filter-control" data-filter="model">
        <option value="">全部模型</option>
      </select>
    </div>
    <div class="head-cell">
      <div class="head-label">价格</div>
      <select class="head-select filter-control" data-filter="priceSort">
        <option value="none">默认顺序</option>
        <option value="asc">价格低→高</option>
        <option value="desc">价格高→低</option>
      </select>
    </div>
    <div class="head-cell">
      <div class="head-label">操作</div>
      <button class="reset-filter" type="button" data-reset-filters>重置筛选</button>
    </div>
  </div>

  <div class="mobile-filters">
    <select class="filter-control" data-filter="site">
      <option value="">全部站点</option>
    </select>
    <select class="filter-control" data-filter="check">
      <option value="all">签到：全部</option>
      <option value="yes">签到：有</option>
      <option value="no">签到：无</option>
    </select>
    <select class="filter-control wide" data-filter="model">
      <option value="">全部模型</option>
    </select>
    <select class="filter-control" data-filter="priceSort">
      <option value="none">价格默认</option>
      <option value="asc">价格低→高</option>
      <option value="desc">价格高→低</option>
    </select>
    <select class="filter-control" data-filter="urlSort">
      <option value="none">网址默认</option>
      <option value="asc">网址 A→Z</option>
      <option value="desc">网址 Z→A</option>
    </select>
    <button class="wide" type="button" data-reset-filters>重置筛选</button>
  </div>

  <div class="record-list" id="recordList"></div>
  <div class="footer" id="count"></div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="editor">
    <div class="editor-head">
      <div class="editor-title" id="editorTitle">添加条目</div>
      <button class="close-btn" id="closeBtn">×</button>
    </div>
    <div class="form-grid">
      <div class="field">
        <label>网站名</label>
        <input id="name" placeholder="例如：OpenAI">
      </div>
      <div class="field">
        <label>网址</label>
        <input id="url" placeholder="https://...">
      </div>
      <div class="field">
        <label>签到</label>
        <div class="seg">
          <button type="button" id="checkYes">有</button>
          <button type="button" id="checkNo">无</button>
        </div>
      </div>
      <div class="field full">
        <label>主要模型 / 价格</label>
        <div class="model-price-list" id="modelPriceList"></div>
        <button class="add-pair" type="button" id="addModelBtn">＋ 添加模型</button>
      </div>
    </div>
    <button class="save" id="saveBtn">保存</button>
  </div>
</div>

<script>
const MODEL_OPTIONS = [
  "claude-opus-4-8",
  "claude-opus-5",
  "deepseek-v4-flash",
  "deepseek-v4-pro",
  "deepseek-v4.1-flash",
  "gemini-3.1-pro-preview",
  "gemini-3.5-flash",
  "gemini-3.6-flash",
  "gemini-3.7-flash",
  "gemini-3.8-flash",
  "glm-5.3",
  "gpt-4o-2024-11-20",
  "gpt-4.1",
  "gpt-5.5",
  "gpt-5.6-sol",
  "grok-4.7",
  "kimi-k3"
];

const seed = [
  {name:"OpenAI",url:"https://openai.com",check:true,modelPrices:[
    {model:"gpt-4o-2024-11-20",price:"价格待记录"},
    {model:"gpt-5.6-sol",price:"价格待记录"}
  ]},
  {name:"Anthropic",url:"https://anthropic.com",check:false,modelPrices:[
    {model:"claude-opus-4-8",price:"价格待记录"},
    {model:"claude-opus-5",price:"价格待记录"}
  ]},
  {name:"Google AI",url:"https://ai.google.dev",check:true,modelPrices:[
    {model:"gemini-3.1-pro-preview",price:"价格待记录"},
    {model:"gemini-3.5-flash",price:"价格待记录"}
  ]}
]

function normalizeModelPrices(item){
  if(Array.isArray(item?.modelPrices)){
    return item.modelPrices.map(x=>({
      model:String(x?.model ?? "").trim(),
      price:String(x?.price ?? "").trim()
    })).filter(x=>x.model || x.price);
  }
  if(typeof item?.models === "string" && item.models.trim()){
    return item.models.split("\n").filter(Boolean).map(line=>{
      const parts = line.split(/｜|\|/);
      return {model:(parts.shift() || "").trim(),price:parts.join("｜").trim()};
    });
  }
  return [];
}
function normalizeRecord(item){
  return {
    name:String(item?.name ?? "").trim() || "未命名",
    url:String(item?.url ?? "").trim(),
    check:Boolean(item?.check),
    modelPrices:normalizeModelPrices(item)
  };
}
const stored = JSON.parse(localStorage.getItem("api-records-demo") || "null");
let rows = Array.isArray(stored) ? stored.map(normalizeRecord) : seed;
let editingIndex = null;
let checkValue = true;

const $ = id => document.getElementById(id);
const recordList = $("recordList");

const filterState = {
  site:"",
  check:"all",
  model:"",
  priceSort:"none",
  urlSort:"none"
};

function esc(s=""){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function parsePrice(value){
  const text = String(value ?? "").replace(/,/g,"");
  const match = text.match(/-?\d+(?:\.\d+)?/);
  return match ? Number(match[0]) : null;
}
function sortPriceForRecord(record){
  const nums = (record.visiblePairs || [])
    .map(x=>parsePrice(x.price))
    .filter(x=>Number.isFinite(x));
  if(!nums.length) return null;
  return filterState.priceSort === "desc" ? Math.max(...nums) : Math.min(...nums);
}
function hostnameFor(url){
  try{return new URL(url).hostname.toLowerCase();}
  catch{return String(url || "").toLowerCase();}
}
function refreshFilterOptions(){
  const siteNames = [...new Set(rows.map(r=>r.name).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"zh-CN"));
  const modelNames = [...new Set([
    ...MODEL_OPTIONS,
    ...rows.flatMap(r=>(r.modelPrices || []).map(x=>x.model)).filter(Boolean)
  ])].sort((a,b)=>a.localeCompare(b,"en"));

  document.querySelectorAll('[data-filter="site"]').forEach(select=>{
    const current = filterState.site;
    select.innerHTML = '<option value="">全部站点</option>' +
      siteNames.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join("");
    select.value = siteNames.includes(current) ? current : "";
    if(current && !siteNames.includes(current)) filterState.site = "";
  });

  document.querySelectorAll('[data-filter="model"]').forEach(select=>{
    const current = filterState.model;
    select.innerHTML = '<option value="">全部模型</option>' +
      modelNames.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join("");
    select.value = modelNames.includes(current) ? current : "";
    if(current && !modelNames.includes(current)) filterState.model = "";
  });

  document.querySelectorAll('[data-filter="check"]').forEach(el=>el.value=filterState.check);
  document.querySelectorAll('[data-filter="priceSort"]').forEach(el=>el.value=filterState.priceSort);
  document.querySelectorAll('[data-filter="urlSort"]').forEach(el=>el.value=filterState.urlSort);
}
function render(){
  refreshFilterOptions();

  let filtered = rows
    .map((r,i)=>({
      ...r,
      _i:i,
      visiblePairs: filterState.model
        ? (r.modelPrices || []).filter(x=>x.model===filterState.model)
        : [...(r.modelPrices || [])]
    }))
    .filter(r => !filterState.site || r.name===filterState.site)
    .filter(r => filterState.check==="all" || (filterState.check==="yes" ? r.check : !r.check))
    .filter(r => !filterState.model || r.visiblePairs.length>0);

  if(filterState.priceSort!=="none"){
    filtered.sort((a,b)=>{
      const av = sortPriceForRecord(a);
      const bv = sortPriceForRecord(b);
      if(av===null && bv===null) return a._i-b._i;
      if(av===null) return 1;
      if(bv===null) return -1;
      return filterState.priceSort==="asc" ? av-bv : bv-av;
    });
  }else if(filterState.urlSort!=="none"){
    filtered.sort((a,b)=>{
      const av = hostnameFor(a.url);
      const bv = hostnameFor(b.url);
      return filterState.urlSort==="asc"
        ? av.localeCompare(bv,"en")
        : bv.localeCompare(av,"en");
    });
  }

  recordList.innerHTML = filtered.length ? filtered.map(r => {
    let pairs = r.visiblePairs.length ? [...r.visiblePairs] : [{model:"",price:""}];

    if(filterState.priceSort!=="none"){
      pairs.sort((a,b)=>{
        const av = parsePrice(a.price);
        const bv = parsePrice(b.price);
        if(av===null && bv===null) return 0;
        if(av===null) return 1;
        if(bv===null) return -1;
        return filterState.priceSort==="asc" ? av-bv : bv-av;
      });
    }

    const rowSpan = pairs.length;
    const pairHtml = pairs.map((x,idx) => `
      <div class="record-cell model-cell ${x.model ? "" : "pair-empty"} ${idx===rowSpan-1 ? "last-row" : ""}"
           style="grid-column:3;grid-row:${idx+1}">${esc(x.model || "—")}</div>
      <div class="record-cell price-cell ${x.price ? "" : "pair-empty"} ${idx===rowSpan-1 ? "last-row" : ""}"
           style="grid-column:4;grid-row:${idx+1}">${esc(x.price || "—")}</div>
    `).join("");

    return `
      <div class="site-record">
        <div class="site-cell site-name" style="grid-column:1;grid-row:1 / span ${rowSpan}">
          <span>${esc(r.name)}</span>
          <span class="mini-check ${r.check?'yes':'no'}">${r.check?'有':'无'}</span>
        </div>
        <div class="site-cell site-url" style="grid-column:2;grid-row:1 / span ${rowSpan}">
          <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>
        </div>
        ${pairHtml}
        <div class="site-controls" style="grid-row:1 / span ${rowSpan}">
          <button class="icon-btn edit" onclick="editRow(${r._i})" title="编辑">✎</button>
          <button class="icon-btn del" onclick="deleteRow(${r._i})" title="删除">×</button>
        </div>
      </div>
    `;
  }).join("") : `<div class="empty">暂无符合筛选条件的条目</div>`;

  $("count").textContent = `共 ${filtered.length} 条记录`;
  localStorage.setItem("api-records-demo", JSON.stringify(rows));
}
function setCheck(v){
  checkValue = v;
  $("checkYes").classList.toggle("active", v);
  $("checkNo").classList.toggle("active", !v);
}
function modelOptionsHtml(selected=""){
  const isCustom = Boolean(selected && !MODEL_OPTIONS.includes(selected));
  const base = '<option value="">选择模型</option>';
  const preset = MODEL_OPTIONS
    .map(m=>`<option value="${esc(m)}" ${m===selected?"selected":""}>${esc(m)}</option>`)
    .join("");
  const custom = `<option value="__custom__" ${isCustom?"selected":""}>＋ 自定义模型名称</option>`;
  return base + preset + custom;
}
function addModelPriceRow(item={model:"",price:""}){
  const wrap = document.createElement("div");
  wrap.className = "model-price-row";
  const isCustom = Boolean(item.model && !MODEL_OPTIONS.includes(item.model));
  wrap.innerHTML = `
    <select class="model-select">${modelOptionsHtml(item.model || "")}</select>
    <input class="price-input" placeholder="价格" value="${esc(item.price || "")}">
    <button class="remove-pair" type="button" title="删除">×</button>
    <input class="custom-model-input ${isCustom ? "show" : ""}" placeholder="输入自定义模型名称" value="${isCustom ? esc(item.model) : ""}">
  `;

  const select = wrap.querySelector(".model-select");
  const customInput = wrap.querySelector(".custom-model-input");

  select.addEventListener("change", ()=>{
    const customMode = select.value === "__custom__";
    customInput.classList.toggle("show", customMode);
    if(customMode){
      setTimeout(()=>customInput.focus(), 0);
    }else{
      customInput.value = "";
    }
  });

  wrap.querySelector(".remove-pair").onclick = ()=>wrap.remove();
  $("modelPriceList").appendChild(wrap);
}
function getEditorModelPrices(){
  return [...$("modelPriceList").querySelectorAll(".model-price-row")].map(row=>{
    const selectValue = row.querySelector(".model-select").value.trim();
    const customValue = row.querySelector(".custom-model-input").value.trim();
    return {
      model:selectValue === "__custom__" ? customValue : selectValue,
      price:row.querySelector(".price-input").value.trim()
    };
  }).filter(x=>x.model || x.price);
}
function openEditor(data=null,index=null){
  editingIndex = index;
  $("editorTitle").textContent = index===null ? "添加条目" : "编辑条目";
  $("name").value = data?.name || "";
  $("url").value = data?.url || "";
  $("modelPriceList").innerHTML = "";
  const pairs = data ? normalizeModelPrices(data) : [];
  (pairs.length ? pairs : [{model:"",price:""}]).forEach(addModelPriceRow);
  setCheck(data?.check ?? true);
  $("modal").classList.add("open");
  setTimeout(()=>$("name").focus(),50);
}
function closeEditor(){
  $("modal").classList.remove("open");
}
window.editRow = function(i){openEditor(rows[i],i)}
window.deleteRow = function(i){
  if(confirm("删除这条记录？")){
    rows.splice(i,1);
    render();
  }
}
$("addBtn").onclick = ()=>openEditor();
$("closeBtn").onclick = closeEditor;
$("modal").addEventListener("click",e=>{ if(e.target===$("modal")) closeEditor(); });
$("checkYes").onclick = ()=>setCheck(true);
$("checkNo").onclick = ()=>setCheck(false);
$("addModelBtn").onclick = ()=>addModelPriceRow();

document.querySelectorAll(".filter-control").forEach(control=>{
  control.addEventListener("change", e=>{
    const key = e.target.dataset.filter;
    filterState[key] = e.target.value;
    render();
  });
});
document.querySelectorAll("[data-reset-filters]").forEach(button=>{
  button.addEventListener("click", ()=>{
    filterState.site = "";
    filterState.check = "all";
    filterState.model = "";
    filterState.priceSort = "none";
    filterState.urlSort = "none";
    render();
  });
});

$("exportBtn").onclick = ()=>{
  const backup = {
    version: 3,
    exportedAt: new Date().toISOString(),
    records: rows
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const date = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `api-site-record-backup-${date}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
};

$("importBtn").onclick = ()=>$("importFile").click();

$("importFile").addEventListener("change", async e=>{
  const file = e.target.files?.[0];
  e.target.value = "";
  if(!file) return;

  try{
    const parsed = JSON.parse(await file.text());
    const incoming = Array.isArray(parsed) ? parsed : parsed?.records;
    if(!Array.isArray(incoming)) throw new Error("格式错误");

    const normalized = incoming.map(normalizeRecord);

    if(!confirm(`导入 ${normalized.length} 条记录并覆盖当前 ${rows.length} 条记录？`)) return;

    rows = normalized;
    render();
    alert("导入完成");
  }catch(err){
    alert("导入失败：请选择本网站导出的 JSON 备份文件。");
  }
});

$("saveBtn").onclick = ()=>{
  const item = {
    name:$("name").value.trim() || "未命名",
    url:$("url").value.trim(),
    check:checkValue,
    modelPrices:getEditorModelPrices()
  };
  if(editingIndex===null) rows.unshift(item);
  else rows[editingIndex]=item;
  closeEditor();
  render();
};
render();
</script>
</body>
</html>
